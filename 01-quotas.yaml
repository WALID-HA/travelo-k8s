# (b) Quotas : plafond global du namespace + limites par conteneur / Pod
apiVersion: v1
kind: ResourceQuota
metadata:
  name: travelo-quota
  namespace: travelo
spec:
  hard:
    pods: "12"
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
---
# LimitRange : valeurs par défaut et maximum pour chaque conteneur / Pod du namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: travelo-limits
  namespace: travelo
spec:
  limits:
    - type: Container
      default:            # limite appliquée si le conteneur n'en déclare pas
        cpu: 500m
        memory: 512Mi
      defaultRequest:     # demande appliquée si le conteneur n'en déclare pas
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: Pod
      max:
        cpu: "1500m"
        memory: 1536Mi
