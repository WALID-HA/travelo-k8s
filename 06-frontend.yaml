# Frontend React servi par nginx (port 3000) : 2 réplicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels: { app: travelo-frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: travelo-frontend, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: vvalid/travelo-frontend:1.0
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          # (e) Sondes HTTP sur la page d'accueil
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  type: ClusterIP
  selector: { app: travelo-frontend }
  ports:
    - name: http
      port: 3000
      targetPort: http
