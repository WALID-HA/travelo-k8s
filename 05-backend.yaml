# Backend Spring Boot : 2 réplicas, image publiée sur Docker Hub au Devoir 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels: { app: travelo-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: travelo-backend, tier: backend }
    spec:
      # Attend que MySQL accepte les connexions avant de lancer Spring
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z travelo-database 3306; do echo 'attente MySQL...'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: backend
          image: vvalid/travelo-backend:1.1
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: { name: travelo-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: travelo-db-secret, key: SPRING_DATASOURCE_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          # (e) Sondes sur l'endpoint /api/hello
          startupProbe:
            httpGet: { path: /api/hello, port: http }
            periodSeconds: 5
            failureThreshold: 36       # jusqu'à 3 min pour démarrer Spring
          readinessProbe:
            httpGet: { path: /api/hello, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/hello, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  type: ClusterIP
  selector: { app: travelo-backend }
  ports:
    - name: http
      port: 8080
      targetPort: http
