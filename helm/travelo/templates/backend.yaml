{{- $n := include "travelo.name" . -}}
{{- $b := .Values.backend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-backend
  labels: {{- include "travelo.labels" . | nindent 4 }}
spec:
  replicas: {{ $b.replicas }}
  selector:
    matchLabels: { app: {{ $n }}-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: {{ $n }}-backend, tier: backend }
      annotations:
        # redéploie les pods si la configuration change (helm upgrade)
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z {{ $n }}-database 3306; do echo 'attente MySQL...'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: backend
          image: "{{ $b.image }}:{{ $b.tag }}"
          ports:
            - { containerPort: {{ $b.port }}, name: http }
          envFrom:
            - configMapRef: { name: {{ $n }}-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $n }}-db-secret, key: SPRING_DATASOURCE_PASSWORD } }
          resources: {{- toYaml $b.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ $b.healthPath }}, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: {{ $b.healthPath }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $b.healthPath }}, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-backend
  labels: {{- include "travelo.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $n }}-backend }
  ports:
    - { name: http, port: {{ $b.port }}, targetPort: http }
