{{- $n := include "travelo.name" . -}}
{{- $f := .Values.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-frontend
  labels: {{- include "travelo.labels" . | nindent 4 }}
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels: { app: {{ $n }}-frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: {{ $n }}-frontend, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ $f.image }}:{{ $f.tag }}"
          ports:
            - { containerPort: {{ $f.port }}, name: http }
          resources: {{- toYaml $f.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-frontend
  labels: {{- include "travelo.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $n }}-frontend }
  ports:
    - { name: http, port: {{ $f.port }}, targetPort: http }
